rules:

###############################################################################
# ============================= CLIENT-SIDE (BROWSER) =========================
###############################################################################

- id: client-dom-xss
  message: User-controlled data reaches dangerous DOM sink (XSS)
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: event.target.value
    - pattern: location.search
    - pattern: location.hash
    - pattern: document.cookie
    - pattern: window.name
  pattern-sinks:
    - pattern: $EL.innerHTML = $DATA
    - pattern: $EL.outerHTML = $DATA
    - pattern: $EL.insertAdjacentHTML($POS, $DATA)
    - pattern: document.write($DATA)

- id: dom-xss-advanced
  message: >
    CRITICAL: DOM XSS – user-controlled data reaches an executable DOM sink
    without proper HTML sanitization.
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sources:
    # ===== Browser Sources =====
    - pattern: location.search
    - pattern: location.hash
    - pattern: location.href
    - pattern: window.location.$PROP
    - pattern: document.URL
    - pattern: document.documentURI
    # URLSearchParams / searchParams helpers (real-world)
    - pattern: new URLSearchParams($PARAMS).get($KEY)
    - pattern: new URLSearchParams($PARAMS).set($KEY, $VAL)
    - pattern: new URLSearchParams($PARAMS).append($KEY, $VAL)
    - pattern: new URLSearchParams($PARAMS).delete($KEY)
    - pattern: $U.searchParams.get($KEY)
    - pattern: $U.searchParams.set($KEY, $VAL)
    - pattern: $U.searchParams.append($KEY, $VAL)
    - pattern: $U.searchParams.delete($KEY)
    - pattern: new URL($URL).searchParams.get($KEY)
    - pattern: new URL($URL).searchParams.set($KEY, $VAL)
    - pattern: new URL($URL).searchParams.append($KEY, $VAL)
    - pattern: new URL($URL).searchParams.delete($KEY)
    - pattern: event.data
    - pattern: window.name
    - pattern: document.referrer
    - pattern: localStorage.getItem($KEY)
    - pattern: sessionStorage.getItem($KEY)
    - pattern: indexedDB.open($DBNAME)
    # ===== Server-Side Sources =====
    - pattern: req.body.$X
    - pattern: req.query.$X
    - pattern: req.params.$X
    - pattern: ctx.request.body
    - pattern: ctx.query
    - pattern: request.body
    - pattern: request.query
    - pattern: request.params
    # ===== NestJS =====
    - pattern: "@Body() $X"
    - pattern: "@Query() $X"
    - pattern: "@Param() $X"
    - pattern: "@Headers() $X"
    # ===== GraphQL =====
    - pattern: args.$X
    - pattern: context.req.body
    - pattern: variables.$X
    # ===== Next.js =====
    - pattern: context.query
    - pattern: context.params
    - pattern: req.nextUrl.searchParams.get($KEY)
  pattern-sinks:
    # ===== Vanilla DOM =====
    - pattern: document.write($DATA)
    - pattern: document.writeln($DATA)
    - pattern: $EL.innerHTML = $DATA
    - pattern: $EL.outerHTML = $DATA
    - pattern: $EL.insertAdjacentHTML($POS, $DATA)
    # ===== React =====
    - pattern-either:
        - pattern: |
            <$X dangerouslySetInnerHTML={{ __html: $DATA }} />
        - pattern: |
            <$X dangerouslySetInnerHTML={{__html: $DATA}} />
        - pattern: |
            <$X dangerouslySetInnerHTML={{ __html: $DATA }}></$X>
        - pattern: |
            <$X dangerouslySetInnerHTML={{__html: $DATA}}></$X>
    # ===== Vue =====
    - pattern: this.$el.innerHTML = $DATA
    # ===== Angular =====
    - pattern: bypassSecurityTrustHtml($DATA)
    - pattern: ElementRef.nativeElement.innerHTML = $DATA
    # ===== jQuery =====
    - pattern: $($SELECTOR).html($DATA)
    - pattern: $($SELECTOR).append($DATA)
    - pattern: $($SELECTOR).prepend($DATA)
    # ===== JS Execution =====
    - pattern: eval($CODE)
    - pattern: Function($CODE)
    - pattern: setTimeout($CODE, $DELAY)
    - pattern: setInterval($CODE, $DELAY)
  pattern-sanitizers:
    # HTML SAFE
    - pattern: DOMPurify.sanitize($DATA)
    - pattern: sanitizeHtml($DATA)
    - pattern: $sce.trustAsHtml($DATA)
    - pattern: _.escape($DATA)
    - pattern: escapeHtml($DATA)
    - pattern: $EL.textContent = $DATA
    - pattern: $EL.innerText = $DATA
  metadata:
    category: security
    cwe: "CWE-79"
    owasp: "A03:2021"
    frameworks:
      - react
      - vue
      - angular
      - jquery
    confidence: "very-high"

- id: client-template-literal-xss
  message: User input embedded into HTML template literal
  severity: WARNING
  languages: [javascript, typescript]
  patterns:
    - pattern: |
        $EL.innerHTML = `...${$INPUT}...`

- id: client-eval-abuse
  message: "CRITICAL: Dangerous dynamic code execution in browser context"
  severity: ERROR
  languages: [javascript, typescript]
  patterns:
    - pattern-either:
        - pattern: eval($X)
        - pattern: new Function($X)
        - pattern: setTimeout($X, ...)
        - pattern: setInterval($X, ...)
    - metavariable-pattern:
        metavariable: $X
        patterns:
          - pattern-either:
              - pattern: location.$ANY
              - pattern: document.$ANY
              - pattern: window.$ANY
              - pattern: $REQ.$ANY
              - pattern: $INPUT

- id: client-localstorage-sensitive
  message: Sensitive data stored in localStorage (XSS exfiltration risk)
  severity: WARNING
  languages: [javascript, typescript]
  pattern-either:
    - pattern: localStorage.setItem("token", $VAL)
    - pattern: localStorage.setItem("access_token", $VAL)
    - pattern: localStorage.setItem("refresh_token", $VAL)
    - pattern: localStorage.setItem("password", $VAL)
    - pattern: localStorage.setItem("secret", $VAL)

- id: client-postmessage-origin-missing
  message: postMessage used without origin validation
  severity: WARNING
  languages: [javascript, typescript]
  patterns:
    - pattern: window.addEventListener("message", $HANDLER)

- id: client-insecure-random
  message: Math.random() used for security-sensitive operation
  severity: INFO
  languages: [javascript, typescript]
  pattern: Math.random()

# -----------------------------------------------------------------------------
# DOM XSS 2026 — taint-based, browser sources → DOM/exec sinks. Propagators.
# -----------------------------------------------------------------------------
- id: dom-xss-2026
  message: "DOM XSS: user-controlled data (location, URLSearchParams, event, storage) reaches HTML or execution sink. CWE-79."
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  options:
    symbolic_propagation: true
  pattern-propagators:
    - pattern: $LHS = $RHS
      from: $RHS
      to: $LHS
    - pattern: $LHS = $A + $B
      from: $A
      to: $LHS
    - pattern: $LHS = $A + $B
      from: $B
      to: $LHS
  pattern-sources:
    - pattern: location.search
    - pattern: location.hash
    - pattern: location.href
    - pattern: location?.search
    - pattern: location?.hash
    - pattern: window.location.search
    - pattern: window.location.hash
    - pattern: window.location.href
    - pattern: document.URL
    - pattern: document.referrer
    - pattern: window.name
    - pattern: event.data
    - pattern: event.target.value
    - pattern: localStorage.getItem($K)
    - pattern: sessionStorage.getItem($K)
    - pattern: new URLSearchParams($X).get($K)
    - pattern: new URL($X).searchParams.get($K)
    - pattern: $U.searchParams.get($K)
  pattern-sinks:
    - pattern: $EL.innerHTML = $DATA
    - pattern: $EL.outerHTML = $DATA
    - pattern: $EL.insertAdjacentHTML($POS, $DATA)
    - pattern: document.write($DATA)
    - pattern: document.writeln($DATA)
    - pattern: $($SEL).html($DATA)
    - pattern: $($SEL).append($DATA)
    - pattern: $($SEL).prepend($DATA)
    - pattern: $EL.setAttribute("href", $DATA)
    - pattern: $EL.setAttribute("src", $DATA)
    - pattern: $EL.setAttribute('href', $DATA)
    - pattern: $EL.setAttribute('src', $DATA)
  pattern-sanitizers:
    - pattern: DOMPurify.sanitize($X)
    - pattern: sanitizeHtml($X)
    - pattern: $EL.textContent = $X
    - pattern: $EL.innerText = $X
    - pattern: document.createTextNode($X)
    - pattern: escapeHtml($X)
    - pattern: _.escape($X)
  metadata:
    category: security
    cwe: "CWE-79"
    owasp: "A03:2021"
    rule_version: "2026.2"
    confidence: "very-high"

# -----------------------------------------------------------------------------
# DOM XSS 2026 Advanced — extra sources (baseURI, performance, clipboard, cookie,
# FormData, history.state) and sinks (parseHTML, createContextualFragment,
# createHTMLDocument, execCommand insertHTML, setHTML). Reduces false positives.
# -----------------------------------------------------------------------------
- id: dom-xss-2026-advanced
  message: "DOM XSS (advanced): user-controlled data reaches HTML/exec sink. Sources: baseURI, performance, clipboard, cookie, FormData, history.state. CWE-79."
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sources:
    - pattern: location.search
    - pattern: location.hash
    - pattern: location.href
    - pattern: document.URL
    - pattern: document.referrer
    - pattern: document.baseURI
    - pattern: document.cookie
    - pattern: window.name
    - pattern: event.data
    - pattern: event.target.value
    - pattern: event.clipboardData.getData($T)
    - pattern: localStorage.getItem($K)
    - pattern: sessionStorage.getItem($K)
    - pattern: history.state
    - pattern: new URLSearchParams($X).get($K)
    - pattern: new URL($X).searchParams.get($K)
    - pattern: $U.searchParams.get($K)
    - pattern: performance.getEntriesByType("navigation")
    - pattern: new FormData($F).get($K)
  pattern-sinks:
    - pattern: $EL.innerHTML = $DATA
    - pattern: $EL.outerHTML = $DATA
    - pattern: $EL.insertAdjacentHTML($POS, $DATA)
    - pattern: document.write($DATA)
    - pattern: document.writeln($DATA)
    - pattern: $($SEL).html($DATA)
    - pattern: $($SEL).append($DATA)
    - pattern: $($SEL).prepend($DATA)
    - pattern: $($SEL).parseHTML($DATA)
    - pattern: $R.createContextualFragment($DATA)
    - pattern: document.implementation.createHTMLDocument($DATA)
    - pattern: $EL.setHTML($DATA)
    - pattern: $EL.setAttribute("href", $DATA)
    - pattern: $EL.setAttribute("src", $DATA)
  pattern-sanitizers:
    - pattern: DOMPurify.sanitize($X)
    - pattern: sanitizeHtml($X)
    - pattern: $EL.textContent = $X
    - pattern: $EL.innerText = $X
    - pattern: document.createTextNode($X)
    - pattern: escapeHtml($X)
    - pattern: _.escape($X)
  metadata:
    category: security
    cwe: "CWE-79"
    owasp: "A03:2021"
    rule_version: "2026.2"
    confidence: "high"

# Exact same-expression flows (AST patterns; no taint). High signal.
- id: dom-xss-innerHTML-location-exact
  message: "DOM XSS: innerHTML = location.search|hash|href. User input written as HTML."
  severity: ERROR
  languages: [javascript, typescript]
  pattern-either:
    - pattern: $EL.innerHTML = location.search
    - pattern: $EL.innerHTML = location.hash
    - pattern: $EL.innerHTML = location.href
    - pattern: $EL.innerHTML = window.location.search
    - pattern: $EL.innerHTML = window.location.hash
  metadata:
    cwe: "CWE-79"
    confidence: "very-high"

- id: dom-xss-innerHTML-searchParams-exact
  message: "DOM XSS: innerHTML = URLSearchParams/searchParams.get(...). User input from URL written as HTML."
  severity: ERROR
  languages: [javascript, typescript]
  pattern-either:
    - pattern: $EL.innerHTML = new URLSearchParams($X).get($K)
    - pattern: $EL.innerHTML = $U.searchParams.get($K)
    - pattern: $EL.innerHTML = new URL($URL).searchParams.get($K)
  metadata:
    cwe: "CWE-79"
    confidence: "very-high"

- id: dom-xss-document-write-location-exact
  message: "DOM XSS: document.write/writeln(location). User input executed as HTML."
  severity: ERROR
  languages: [javascript, typescript]
  pattern-either:
    - pattern: document.write(location.search)
    - pattern: document.write(location.hash)
    - pattern: document.writeln(location.search)
    - pattern: document.writeln(location.hash)
  metadata:
    cwe: "CWE-79"
    confidence: "very-high"

# -----------------------------------------------------------------------------
# 2026-era: Trusted Types bypass, Sanitizer API, BroadcastChannel, dynamic import
# -----------------------------------------------------------------------------
- id: dom-xss-trusted-types-bypass
  message: "DOM XSS: Trusted Types bypass – createHTML/createScript with user input. CWE-79."
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: location.search
    - pattern: location.hash
    - pattern: location.href
    - pattern: event.data
    - pattern: event.target.value
    - pattern: new URLSearchParams($X).get($K)
    - pattern: $U.searchParams.get($K)
    - pattern: localStorage.getItem($K)
    - pattern: sessionStorage.getItem($K)
  pattern-sinks:
    - pattern: $POLICY.createHTML($DATA)
    - pattern: $POLICY.createScript($DATA)
    - pattern: $POLICY.createScriptURL($DATA)
  metadata:
    category: security
    cwe: "CWE-79"
    owasp: "A03:2021"
    confidence: "high"

- id: dom-xss-sanitizer-setHTML
  message: "DOM XSS: Element.setHTML() (Sanitizer API) with user-controlled input. Verify Sanitizer config. CWE-79."
  severity: WARNING
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: location.search
    - pattern: location.hash
    - pattern: event.data
    - pattern: event.target.value
    - pattern: new URLSearchParams($X).get($K)
    - pattern: $U.searchParams.get($K)
  pattern-sinks:
    - pattern: $EL.setHTML($DATA, ...)
    - pattern: $EL.setHTML($DATA)
  metadata:
    category: security
    cwe: "CWE-79"
    confidence: "medium"

- id: client-broadcast-channel-message
  message: "BroadcastChannel message listener without origin validation. Validate event.origin when using event.data. CWE-79."
  severity: WARNING
  languages: [javascript, typescript]
  pattern-either:
    - pattern: $BC.onmessage = $H
    - pattern: $BC.addEventListener("message", $H)
  metadata:
    category: security
    cwe: "CWE-79"
    confidence: "medium"

- id: ssrf-dynamic-import
  message: "Module/import injection: dynamic import() with user-controlled specifier. CWE-829."
  severity: WARNING
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: location.search
    - pattern: location.hash
    - pattern: $REQ.query.$X
    - pattern: $REQ.body.$X
    - pattern: event.data
  pattern-sinks:
    - pattern: import($SPEC)
    - pattern: require($SPEC)
  metadata:
    category: security
    cwe: "CWE-829"
    confidence: "medium"

###############################################################################
# ============================= SERVER-SIDE (NODE / API) =======================
###############################################################################

- id: server-xss-reflection
  message: Reflected XSS via response output
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: $REQ.query.$ANY
    - pattern: $REQ.body.$ANY
    - pattern: $REQ.params.$ANY
    - pattern: $REQ.headers.$ANY
  pattern-sinks:
    - pattern: res.send($DATA)
    - pattern: res.write($DATA)
    - pattern: res.end($DATA)
    - pattern: res.json($DATA)

- id: server-eval-rce
  message: User input reaches eval() or Function() (RCE risk)
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: $REQ.body.$ANY
    - pattern: $REQ.query.$ANY
  pattern-sinks:
    - pattern: eval($CODE)
    - pattern: new Function($CODE)

- id: server-command-injection
  message: Possible OS command injection
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: $REQ.body.$ANY
    - pattern: $REQ.query.$ANY
    - pattern: $REQ.params.$ANY
  pattern-sinks:
    - pattern: require("child_process").exec($CMD)
    - pattern: require("child_process").execSync($CMD)
    - pattern: require("child_process").spawn($CMD, ...)

- id: command-injection-advanced
  message: >
    CRITICAL: Command injection – shell execution with user input.
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sources:
    - pattern: req.body.$X
    - pattern: req.query.$X
    - pattern: req.params.$X
    - pattern: ctx.request.body.$X
    - pattern: request.body.$X
    - pattern: request.query.$X
    - pattern: args.cmd
    - pattern: args.command
  pattern-sinks:
    - pattern: child_process.exec($CMD)
    - pattern: child_process.execSync($CMD)
    - pattern: child_process.spawn($CMD, ...)
    - pattern: child_process.spawnSync($CMD, ...)
    - pattern: child_process.execFile($CMD, ...)
    - pattern: Bun.spawn($CMD, ...)
    - pattern: Deno.run($CMD)
    - pattern: exec($CMD)
    - pattern: execSync($CMD)
    - pattern: spawn($CMD, ...)
  pattern-sanitizers:
    - pattern: path.basename($PATH)
    - pattern: path.resolve($PATH)
    - pattern: escapeShellArg($ARG)
    - pattern: shellEscape($ARG)
  metadata:
    category: security
    cwe: "CWE-78"
    confidence: very-high

- id: server-path-traversal
  message: User input used in filesystem path
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: $REQ.params.$ANY
    - pattern: $REQ.query.$ANY
  pattern-sinks:
    - pattern: fs.readFile($PATH, ...)
    - pattern: fs.readFileSync($PATH)
    - pattern: fs.writeFile($PATH, ...)
    - pattern: fs.createReadStream($PATH)

- id: server-sql-injection
  message: SQL query built using user input
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: $REQ.body.$ANY
    - pattern: $REQ.query.$ANY
  pattern-sinks:
    - pattern: $DB.query($SQL)
    - pattern: $DB.execute($SQL)
    - pattern: $DB.raw($SQL)

- id: sql-injection-string-concat
  message: >
    CRITICAL: SQL Injection via string concatenation in database query.
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: req.body.$X
    - pattern: req.query.$X
    - pattern: req.params.$X
    - pattern: request.body.$X
    - pattern: request.query.$X
  pattern-sinks:
    - pattern: db.query("..." + ...)
    - pattern: connection.query(`...${...}`)
    - pattern: $DB.query($SQL + ...)
    - pattern: $DB.execute($SQL + ...)
    - pattern: $DB.raw($SQL + ...)
    - pattern: sequelize.query($SQL + ...)
    - pattern: knex.raw($SQL + ...)
  pattern-sanitizers:
    - pattern: escape($STR)
    - pattern: mysql.escape($STR)
    - pattern: pg.escape($STR)
  metadata:
    category: security
    cwe: "CWE-89"
    confidence: medium

- id: server-nosql-injection
  message: NoSQL injection via untrusted query object
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: $REQ.body
    - pattern: $REQ.query
  pattern-sinks:
    - pattern: $MODEL.find($QUERY)
    - pattern: $MODEL.findOne($QUERY)
    - pattern: $MODEL.update($QUERY, ...)

# -----------------------------------------------------------------------------
# LDAP injection (taint)
# -----------------------------------------------------------------------------
- id: server-ldap-injection
  message: "CRITICAL: LDAP injection – user input used in LDAP search/bind. CWE-90."
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sources:
    - pattern: req.body.$X
    - pattern: req.query.$X
    - pattern: req.params.$X
    - pattern: request.body.$X
    - pattern: request.query.$X
  pattern-sinks:
    - pattern: ldap.search($BASE, $QUERY, ...)
    - pattern: ldap.bind($DN, ...)
    - pattern: client.search($BASE, $QUERY, ...)
  pattern-sanitizers:
    - pattern: ldap.escape($STR)
    - pattern: escape($STR)
  metadata:
    category: security
    cwe: "CWE-90"
    confidence: high

# -----------------------------------------------------------------------------
# Open redirect (location.href / window.location = user input)
# -----------------------------------------------------------------------------
- id: open-redirect-location-href
  message: "Open redirect: user-controlled URL assigned to location.href or window.location. CWE-601."
  severity: WARNING
  languages: [javascript, typescript]
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sources:
    - pattern: req.query.$X
    - pattern: req.body.$X
    - pattern: req.params.$X
    - pattern: request.query.$X
    - pattern: request.body.$X
    - pattern: location.search
    - pattern: new URLSearchParams($X).get($K)
    - pattern: $U.searchParams.get($K)
  pattern-sinks:
    - pattern: location.href = $URL
    - pattern: location = $URL
    - pattern: window.location.href = $URL
    - pattern: window.location = $URL
    - pattern: location.assign($URL)
    - pattern: location.replace($URL)
  pattern-sanitizers:
    - pattern: new URL($URL)
    - pattern: allowlist.includes($URL)
    - pattern: whitelist.includes($URL)
  metadata:
    category: security
    cwe: "CWE-601"
    confidence: high

# -----------------------------------------------------------------------------
# Path traversal (path.join / fs with user input)
# -----------------------------------------------------------------------------
- id: path-traversal-join
  message: "Path traversal: user input used in path.join or fs path. CWE-22."
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sources:
    - pattern: req.params.$X
    - pattern: req.query.$X
    - pattern: req.body.$X
    - pattern: request.params.$X
    - pattern: request.query.$X
  pattern-sinks:
    - pattern: path.join($BASE, $USER)
    - pattern: path.resolve($BASE, $USER)
    - pattern: fs.readFile($PATH, ...)
    - pattern: fs.readFileSync($PATH)
    - pattern: fs.createReadStream($PATH)
    - pattern: fs.writeFile($PATH, ...)
    - pattern: require("fs").readFile($PATH, ...)
    - pattern: require("fs").readFileSync($PATH)
  pattern-sanitizers:
    - pattern: path.basename($PATH)
    - pattern: path.normalize($PATH)
  metadata:
    category: security
    cwe: "CWE-22"
    confidence: high

# -----------------------------------------------------------------------------
# SQL injection – ORM raw queries (Prisma, TypeORM, Drizzle)
# -----------------------------------------------------------------------------
- id: sql-injection-orm-raw
  message: "CRITICAL: SQL injection via raw query (Prisma/TypeORM/Drizzle) with user input. CWE-89."
  severity: ERROR
  languages: [javascript, typescript]
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sources:
    - pattern: req.body.$X
    - pattern: req.query.$X
    - pattern: req.params.$X
    - pattern: request.body.$X
    - pattern: request.query.$X
  pattern-sinks:
    - pattern: $PRISMA.$queryRaw($SQL)
    - pattern: $PRISMA.$queryRawUnsafe($SQL)
    - pattern: $PRISMA.$executeRaw($SQL)
    - pattern: $ORM.query($SQL + ...)
    - pattern: $ORM.query(`...${...}...`)
    - pattern: $QB.where(`...${...}...`)
    - pattern: $QB.andWhere(`...${...}...`)
    - pattern: sql`...${...}...`
  pattern-sanitizers:
    - pattern: $PRISMA.$queryRaw`...`
    - pattern: escape($STR)
    - pattern: mysql.escape($STR)
  metadata:
    category: security
    cwe: "CWE-89"
    confidence: high

# -----------------------------------------------------------------------------
# ReDoS – dangerous regex (user-controlled or nested quantifiers)
# -----------------------------------------------------------------------------
- id: redos-user-input-regex
  message: "ReDoS: User-controlled input used as regex pattern. CWE-1333."
  severity: WARNING
  languages: [javascript, typescript]
  mode: taint
  pattern-sources:
    - pattern: req.body.$X
    - pattern: req.query.$X
    - pattern: req.params.$X
    - pattern: request.query.$X
  pattern-sinks:
    - pattern: new RegExp($PATTERN)
    - pattern: new RegExp($PATTERN, $FLAGS)
    - pattern: $STR.match($PATTERN)
    - pattern: $STR.replace($PATTERN, ...)
    - pattern: $STR.split($PATTERN)
  metadata:
