<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#cc2222"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#ff4444" stroke-width="8"/>
  <!-- Shield outline -->
  <path d="M256 80 L400 140 L400 280 C400 360 340 420 256 450 C172 420 112 360 112 280 L112 140 Z" 
        fill="none" stroke="url(#red)" stroke-width="12" stroke-linejoin="round"/>
  <!-- Inner shield glow -->
  <path d="M256 110 L370 160 L370 270 C370 335 320 385 256 410 C192 385 142 335 142 270 L142 160 Z" 
        fill="rgba(255,68,68,0.1)"/>
  <!-- CT letters -->
  <text x="256" y="300" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" fill="#ff4444">CT</text>
  <!-- Scan lines -->
  <line x1="180" y1="340" x2="332" y2="340" stroke="#ff4444" stroke-width="4" opacity="0.6"/>
  <line x1="200" y1="360" x2="312" y2="360" stroke="#ff4444" stroke-width="3" opacity="0.4"/>
</svg>
